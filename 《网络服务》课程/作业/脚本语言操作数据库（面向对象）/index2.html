<!DOCtype HTML>

<html>

<head>
    <meta http-equiv="Content-Type" content="text/html';charest=gb2312">
    <!--<meta>标签可提供有关页面的元信息,属性定义了与文档相关联的名称/值对-->
    <!--http-equiv属性为名称/值对提供了名称。并指示服务器在发送实际的文档之前先在要传送给浏览器的 MIME 文档头部包含名称/值对。
    当服务器向浏览器发送文档时，会先发送许多名称/值对。虽然有些服务器会发送许多这种名称/值对，但是所有服务器都至少要发送一个：content-type:text/html。这将告诉浏览器准备接受一个HTML 文档。
    使用带有 http-equiv 属性的 <meta> 标签时，服务器将把名称/值对添加到发送给浏览器的内容头部。-->
    <title>填写用户注册信息并存入数据库</title>
    <!--bootstrap-->
    <link href="bootstrap2\bootstrap\css\bootstrap.min.css" rel="stylesheet" media="screen">
</head>

<body>
    <div class="navbar">
        <div class="navbar-inner">
            <h2 class="text-center">用户注册</h2>
        </div>
    </div>

    <form action="writedatabase.php" method="POST" enctype="multipart/form-data" name="form1"
        class="form-horizontal well">
        <!--multipart/form-data是指表单数据有多部分构成，既有文本数据，又有文件等二进制数据-->

        <div class="control-group">
            <label class="control-label">昵称：</label>
            <div class="controls">
                <input name="user" type="text" id="user" size="30">
            </div>
        </div>

        <div class="control-group">
            <label class="control-label">密码：</label>
            <div class="controls">
                <input name="pwd" type="password" id="pwd" size="30">
            </div>
        </div>

        <div class="control-group">
            <label class="control-label">性别：</label>
            <div class="controls">
                <label class="radio inline">
                    <input name="sex" type="radio" value="男" checked>男
                </label>
                <label class="radio inline">
                    <input name="sex" type="radio">女
                </label>
            </div>
        </div>

        <div class="control-group">
            <label class="control-label">学历：</label>
            <div class="controls">
                <select name="select">
                    <option value="高中">高中</option>
                    <option value="专科">专科</option>
                    <option value="本科" selected>本科</option>
                    <option value="研究生">研究生</option>
                    <option value="博士生">博士生</option>
                    <option value="硕士生">硕士生</option>
                    <!--value 规定在表单被提交时被发送到服务器的值-->
                </select>
            </div>
        </div>

        <div class="control-group">
            <label class="control-label">联系方式：</label>
            <div class="controls">
                <input name="tel" type="text" id="tel" size="30">
            </div>
        </div>

        <div class="control-group">
            <label class="control-label">E-mail：</label>
            <div class="controls">
                <input name="email" type="text" id="email" size="30">
            </div>
        </div>

        <div class="control-group">
            <label class="control-label">个人主页：</label>
            <div class="controls">
                <input name="homepage" type="text" id="homepage" size="30">
            </div>
        </div>

        <div class="control-group">
            <label class="control-label">个人爱好：</label>
            <div class="controls">
                <label class="checkbox inline">
                    <input name="like[]" type="checkbox" id="like[]" value="购物">购物
                </label>
                <label class="checkbox inline">
                    <input name="like[]" type="checkbox" id="like[]" value="上网">上网
                </label>
                <label class="checkbox inline">
                    <input name="like[]" type="checkbox" id="like[]" value="看电影">看电影
                </label>
                <label class="checkbox inline">
                    <input name="like[]" type="checkbox" id="like[]" value="旅游">旅游
                </label>
                <!--value指这个复选框的值-->
            </div>
        </div>

        <div class="control-group">
            <label class="control-label">我的照片：</label>
            <div class="controls">
                <input name="photo" type="file" id="photo" size="25">
            </div>
        </div>

        <div class="control-group">
            <label class="control-label">个人简介：</label>
            <div class="controls">
                <textarea name="instr" cols="35" rows="4" id="instr"></textarea>
            </div>
        </div>

        <div class="control-group">
            <div class="controls">
                <input type="submit" name="Submit" value="注册" class="btn btn-primary">&nbsp;&nbsp;
                <input type="reset" name="Submit2" value="重置" class="btn">
                <!--不能用bootstrap的<button>-->
            </div>
        </div>

    </form>

    <!--bootstrap-->
    <script src="bootstrap2\bootstrap\js\jquery.js"></script>
    <script src="bootstrap2\bootstrap\js\bootstrap.min.js"></script>
</body>

</html>
