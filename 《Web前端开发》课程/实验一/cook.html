	<div id="cook" class="container">

		<h1>咖啡COOK</h1>
		<h2>器具</h2>
		<img src="images/cooker.jpg" alt="">
		<p>
				咖啡器具，指磨制、煮制、品尝咖啡的器具。
			<br>
			较有特色的咖啡器具有蒸汽加压咖啡器、虹吸咖啡器具、
			<br>
				   浓缩咖啡器、直桶形的浓缩咖啡器等。
			<br>
					   是咖啡文化的重要组成部分。
		</p>
		<h2>调查</h2>
		<form action="">
			喜欢的品牌
			<input type="text">
			产地
			<select>
				<option>英国</option>
				<option>巴西</option>
				<option>哥伦布</option>
				<option>埃塞俄比亚</option>
			</select>
			<br>
			喜欢的原因 
			外观<input type="checkbox">
			功能<input type="checkbox">
			价格<input type="checkbox">
			<br>
			<textarea cols="30" rows="15" onfocus="this.value=''">
				其他原因...
			</textarea>
			<br>
			打分 
			<input type="radio">1
			<input type="radio">2
			<input type="radio">3
			<input type="radio">4
			<input type="radio">5
			<br>
			<input type="submit" value="提交">
			<input type="reset" value="重置">
		</form>
