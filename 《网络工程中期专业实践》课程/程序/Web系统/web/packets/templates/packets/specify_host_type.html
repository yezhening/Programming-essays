<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显示域名信息</title>

    <!-- 使用bootstrap4 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
        integrity="sha384-zCbKRCUGaJDkqS1kPbPd7TveP5iyJE0EjAuZQTgFLD2ylzuqKfdKlfG/eSrtxUkn" crossorigin="anonymous">

    <!-- CSS -->
    <style type="text/css">
        /* 表格样式 */
        table {
            table-layout: fixed;
            /* 列宽由表格宽度和列宽度设定 */
        }

        /* 单元格 */
        table td {
            /* max-width: 100%; */
            /* 设置隐藏显示的最大宽度 */
            overflow: hidden;
            /* 文字长度超出限定宽度，则隐藏超出的内容 */
            text-overflow: ellipsis;
            /* 规定当文本溢出时，显示省略符号来代表被省略的文本 */
            white-space: nowrap;
            /* 设置文字在一行显示，不能换行 */
            word-break: keep-all;
            /* 只能在半角空格或连字符处换行 */
        }

        /* 鼠标悬停单元格 */
        table td:hover {
            overflow: auto;
            /* 如果内容被修剪，则浏览器会显示滚动条以便查看其余的内容。*/
            display: -webkit-box;
            /* 将对象作为弹性伸缩盒子模型显示 能显示省略内容的重点*/

            /* white-space: pre-wrap; */
            /* 保留空白符序列，但是正常地进行换行	 */
            /* -webkit-line-clamp: 2; */
            /*   	控制最多显示几行，这里采用最多显示两行  和"white-space"连用*/
            /* -webkit-box-orient: vertical;*/
            /* 设置或检索伸缩盒对象的子元素的排列方式    */
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-md bg-light navbar-light fixed-top">
        <a class="navbar-brand" href="{% url 'rbac:homepage' %}">主页</a>
        <!-- 链接 -->
        <div class="collapse navbar-collapse justify-content-end" id="collapsibleNavbar">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'rbac:homepage' %}">主页</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 第二个空导航栏，占位置 -->
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-md bg-light navbar-light">
        <a class="navbar-brand" href="#">成果认定</a>
    </nav>

    <!-- 其他 -->
    <p></p>
    <h3 class="text-center">数据库存储信息</h4>
        {% if who_objs %}
        <table class="table table-striped">
            <thead class="thead-dark">
                <tr>
                    <th scope="col">域名</th>
                    <th scope="col">注册人组织</th>
                    <th scope="col">注册人</th>
                    <th scope="col">注册人联系电话</th>
                    <th scope="col">指定域名类型</th>
                </tr>
            </thead>
            <tbody>
                {% for who_obj in who_objs %}
                <tr>
                    <td>{{ who_obj.domain_name }}</td>
                    <td>{{ who_obj.registrant_organization }}</td>
                    <td>{{ who_obj.registrar }}</td>
                    <td>{{ who_obj.registrar_phone }}</td>
                    <td><a class="btn btn-info" href="{% url 'packets:alter_host_type' who_obj.domain_name %}" role="button">修改</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% endif %}
</body>

</html>
